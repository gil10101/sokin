name: Frontend CI/CD

on:
  push:
    branches: [main, develop]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci-cd.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci-cd.yml'

env:
  NODE_VERSION: '22.x'
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  lint-and-build:
    name: Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint --workspace=frontend

      # The suite was never run here. Lint and build both passed on commits
      # that broke tested behaviour, because nothing executed the tests.
      - name: Run tests
        run: npm run test --workspace=frontend

      # Deliberately no env here. The build must not need runtime configuration
      # to succeed - it used to, and that is exactly what kept this job red.
      - name: Build frontend
        run: npm run build --workspace=frontend

# No deploy job here on purpose.
#
# This repository is connected to Vercel's Git integration, which builds and
# deploys every push to main by itself. The workflow used to deploy as well,
# which meant two production deployments raced on every push - and because the
# action it used had been failing since long before anyone noticed, the only
# visible effect was a permanently red pipeline next to a site that was
# updating fine on its own.
#
# What is left here are the gates that actually add something the Git
# integration does not run: lint, the test suite, and a build that must not
# depend on runtime configuration.
#
# If deploys should move here instead, turn the Git integration off first,
# otherwise both will fire. The removed steps are in git history.
