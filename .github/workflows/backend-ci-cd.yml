# Backend CI Pipeline
#
# Quality gates for the Sokin backend. Deployment is Vercel's Git integration,
# not this workflow - see the note at the end of the file.
#
# Features:
# - Comprehensive Jest testing with coverage
# - TypeScript type checking
# - ESLint code quality checks
# - Security auditing

name: Backend CI/CD

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci-cd.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci-cd.yml'

env:
  NODE_VERSION: '22.x'

jobs:
  # ====================
  # Lint and Type Check
  # ====================
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: .

      - name: Run ESLint
        run: npm run lint

      - name: TypeScript type check
        run: npx tsc --noEmit

  # ====================
  # Unit Tests
  # ====================
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: .

      - name: Run tests with coverage
        run: npm run test:ci
        env:
          NODE_ENV: test
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: backend/coverage/lcov.info
          flags: backend
          fail_ci_if_error: false
          verbose: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: backend/coverage/
          retention-days: 30

      - name: Check coverage threshold
        run: |
          COVERAGE=$(cat coverage/coverage-summary.json | jq '.total.lines.pct')
          echo "Line coverage: $COVERAGE%"
          COVERAGE_INT=${COVERAGE%.*}
          COVERAGE_INT=${COVERAGE_INT:-0}
          if [ "$COVERAGE_INT" -lt 70 ]; then
            echo "::warning::Coverage is below 70% threshold"
          fi

  # ====================
  # Build Check
  # ====================
  build:
    name: Build Check
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: .

      - name: Build TypeScript
        run: npm run build

      - name: Verify build output
        run: |
          if [ ! -f "dist/index.js" ]; then
            echo "Build failed: dist/index.js not found"
            exit 1
          fi
          echo "Build successful: dist/index.js exists"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: backend-build
          path: backend/dist/
          retention-days: 7

  # ====================
  # Security Audit
  # ====================
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: .

      - name: Run npm audit
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Check for known vulnerabilities
        run: |
          AUDIT_RESULT=$(npm audit --json 2>/dev/null || true)
          HIGH_VULNS=$(echo $AUDIT_RESULT | jq '.metadata.vulnerabilities.high // 0')
          CRITICAL_VULNS=$(echo $AUDIT_RESULT | jq '.metadata.vulnerabilities.critical // 0')
          
          if [ "$CRITICAL_VULNS" -gt 0 ]; then
            echo "::error::$CRITICAL_VULNS critical vulnerabilities found"
            exit 1
          fi
          
          if [ "$HIGH_VULNS" -gt 0 ]; then
            echo "::warning::$HIGH_VULNS high severity vulnerabilities found"
          fi
          
          echo "Security audit passed"

  # ====================
  # Notify on Failure
  # ====================
  notify-failure:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: [lint, test, build, security]
    if: failure() && github.ref == 'refs/heads/main'

    # Without this the job cannot open the issue it exists to open: the default
    # GITHUB_TOKEN is read-only for issues, so every notification attempt died
    # with "Resource not accessible by integration" (403) and turned one failed
    # job into two. Scoped to this job rather than the workflow, since nothing
    # else here needs to write.
    permissions:
      issues: write

    steps:
      - name: Create failure issue
        uses: actions/github-script@v9
        with:
          script: |
            const title = `🚨 Production Deployment Failed - ${new Date().toISOString().split('T')[0]}`;
            const body = [
              '## Deployment Failure Alert',
              '',
              `**Workflow:** ${context.workflow}`,
              `**Run:** [#${context.runNumber}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
              `**Commit:** \`${context.sha}\``,
              `**Actor:** @${context.actor}`,
              '',
              '### Action Required',
              'Please investigate the deployment failure and take appropriate action.',
              '',
              '### Rollback Information',
              'If automatic rollback was triggered, verify the production environment is stable.'
            ].join('\n');
            
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ['deployment', 'production', 'urgent']
            });

# No deploy job here on purpose.
#
# This repository is connected to Vercel's Git integration, which builds and
# deploys every push to main by itself. The workflow used to deploy as well,
# which meant two production deployments raced on every push - and because the
# action it used had been failing since long before anyone noticed, the only
# visible effect was a permanently red pipeline next to a site that was
# updating fine on its own.
#
# What is left here are the gates that actually add something the Git
# integration does not run: lint, the test suite, and a build that must not
# depend on runtime configuration.
#
# If deploys should move here instead, turn the Git integration off first,
# otherwise both will fire. The removed steps are in git history.
